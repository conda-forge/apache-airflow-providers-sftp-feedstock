context:
  name: apache-airflow-providers-sftp
  version: 6.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_sftp-${{ version }}.tar.gz
  sha256: 7592b6c80cbfcde779a679f4b3c1c0778d119ef5c9631427610a337fe5363988

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.0.2
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0
    - apache-airflow-providers-ssh >=6.0.0
    - apache-airflow-providers-common-compat >=1.12.0
    - paramiko >=4.0.0
    # tightest of upstream's floors (python >=3.14)
    - asyncssh >=2.22.0
tests:
  - python:
      imports:
        - airflow.providers.sftp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-sftp for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-sftp/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
